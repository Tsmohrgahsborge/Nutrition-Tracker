<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product Scanner</title>

  <!-- Barcode scanner library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Open Food Facts API calls only -->
  <script src="openfood.js" defer></script>

  <!-- Main scanner/app code -->
  <script src="app.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2f7, #dce3ec);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
      color: #222;
    }

    p {
      color: #666;
      font-size: 15px;
    }

    #scanButton {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #scanButton:active {
      transform: scale(0.98);
    }

    #resultBox {
      margin-top: 22px;
      padding: 16px;
      background: #f3f4f6;
      border-radius: 14px;
      color: #222;
      font-size: 16px;
      word-break: break-all;
    }

    #scannedItems {
      margin-top: 18px;
      text-align: left;
    }

    .scanned-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 14px;
    }

    .scanned-item img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
    }

    .no-image {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 10px;
      color: #777;
      font-size: 11px;
      text-align: center;
    }

    .scanned-item strong {
      font-size: 15px;
      color: #222;
    }

    .scanner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      padding: 20px;
    }

    #closeScanner {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 1000;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 90px auto 0;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
    }

    .scanner-text {
      color: white;
      text-align: center;
      margin-top: 18px;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Product Scanner</h1>
    <p>Press the button and scan a product barcode.</p>

    <button id="scanButton">Scan Product</button>

    <div id="resultBox">
      Barcode ID will appear here.
    </div>

    <div id="scannedItems"></div>
  </main>

  <section id="scannerOverlay" class="scanner-overlay">
    <button id="closeScanner">&times;</button>

    <div id="reader"></div>

    <p class="scanner-text">Point your camera at a barcode.</p>
  </section>
</body>
</html>
